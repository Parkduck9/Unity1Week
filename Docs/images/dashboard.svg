<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" font-family="Inter, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="612" fill="#121212"/>

  <!-- KPI 3개 (각 4칸) -->
  <g>
    <rect x="24" y="24" width="368" height="140" rx="16" fill="#1E1E1E" stroke="#2C2C2E"/>
    <text x="44" y="60" fill="#98989D" font-size="14">개발 단계</text>
    <text x="44" y="108" fill="#FFFFFF" font-size="32" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">11 / 11</text>
    <circle cx="50" cy="136" r="4" fill="#32D74B"/>
    <text x="62" y="141" fill="#32D74B" font-size="14">0~10단계 완료 (Windows 포팅 포함)</text>

    <rect x="416" y="24" width="368" height="140" rx="16" fill="#1E1E1E" stroke="#2C2C2E"/>
    <text x="436" y="60" fill="#98989D" font-size="14">PlayMode 자동 테스트</text>
    <text x="436" y="108" fill="#FFFFFF" font-size="32" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">41 / 41</text>
    <circle cx="442" cy="136" r="4" fill="#32D74B"/>
    <text x="454" y="141" fill="#32D74B" font-size="14">전부 통과 · 빌드 경고 0, 에러 0</text>

    <rect x="808" y="24" width="368" height="140" rx="16" fill="#1E1E1E" stroke="#2C2C2E"/>
    <text x="828" y="60" fill="#98989D" font-size="14">캐릭터 복셀 수</text>
    <text x="828" y="108" fill="#FFFFFF" font-size="32" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">11,090</text>
    <circle cx="834" cy="136" r="4" fill="#32D74B"/>
    <text x="846" y="141" fill="#32D74B" font-size="14">블록 0.025 · 디테일 3차 적용</text>
  </g>

  <!-- 난이도 그래프 (8칸) -->
  <g>
    <rect x="24" y="188" width="760" height="400" rx="16" fill="#1E1E1E" stroke="#2C2C2E"/>
    <text x="44" y="224" fill="#FFFFFF" font-size="18" font-weight="600">시간에 따른 난이도</text>
    <text x="44" y="246" fill="#98989D" font-size="13">HoleManager: 최대 구멍 1 → 14칸, 떨어지는 간격 3 → 1초 (60초 동안)</text>
    <g stroke="#2C2C2E" stroke-width="1">
      <line x1="88" y1="530" x2="760" y2="530"/>
      <line x1="88" y1="440" x2="760" y2="440"/>
      <line x1="88" y1="350" x2="760" y2="350"/>
      <line x1="88" y1="260" x2="760" y2="260"/>
    </g>
    <g fill="#98989D" font-size="12" font-family="'JetBrains Mono', Consolas, monospace">
      <text x="76" y="534" text-anchor="end">0</text>
      <text x="76" y="444" text-anchor="end">5</text>
      <text x="76" y="354" text-anchor="end">10</text>
      <text x="76" y="264" text-anchor="end">15</text>
      <text x="770" y="534">0s</text>
      <text x="770" y="444">1s</text>
      <text x="770" y="354">2s</text>
      <text x="770" y="264">3s</text>
      <text x="88" y="552" text-anchor="middle">0</text>
      <text x="280" y="552" text-anchor="middle">20</text>
      <text x="472" y="552" text-anchor="middle">40</text>
      <text x="664" y="552" text-anchor="middle">60</text>
      <text x="752" y="552" text-anchor="end">초</text>
    </g>
    <path d="M88,530 L88,512 L111,512 L111,494 L155.2,494 L155.2,476 L199.4,476 L199.4,458 L243.5,458 L243.5,440 L287.7,440 L287.7,422 L331.8,422 L331.8,404 L376,404 L376,386 L421.1,386 L421.1,368 L465.3,368 L465.3,350 L509.4,350 L509.4,332 L553.6,332 L553.6,314 L597.8,314 L597.8,296 L641.9,296 L641.9,278 L760,278 L760,530 Z" fill="url(#area)"/>
    <path d="M88,512 L111,512 L111,494 L155.2,494 L155.2,476 L199.4,476 L199.4,458 L243.5,458 L243.5,440 L287.7,440 L287.7,422 L331.8,422 L331.8,404 L376,404 L376,386 L421.1,386 L421.1,368 L465.3,368 L465.3,350 L509.4,350 L509.4,332 L553.6,332 L553.6,314 L597.8,314 L597.8,296 L641.9,296 L641.9,278 L760,278" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
    <path d="M88,260 L664,440 L760,440" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
    <g font-size="13">
      <rect x="480" y="210" width="14" height="14" rx="3" fill="#00E5FF"/>
      <text x="500" y="222" fill="#FFFFFF">최대 구멍 수(칸)</text>
      <line x1="620" y1="217" x2="642" y2="217" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="648" y="222" fill="#FFFFFF">간격(초)</text>
    </g>
    <text x="44" y="574" fill="#98989D" font-size="12">플레이어 주변 8칸 중 1칸은 항상 남김 → 점프로만 버틸 수 있음</text>
  </g>

  <!-- 문제와 해결 (4칸) -->
  <g>
    <rect x="808" y="188" width="368" height="400" rx="16" fill="#1E1E1E" stroke="#2C2C2E"/>
    <text x="828" y="224" fill="#FFFFFF" font-size="18" font-weight="600">문제와 해결</text>
    <g font-size="13">
      <rect x="828" y="244" width="328" height="72" rx="6" fill="#3A1C1C"/>
      <rect x="828" y="244" width="4" height="72" fill="#FF453A"/>
      <text x="844" y="270" fill="#FF453A" font-weight="600">캐릭터에 얼룩 그림자</text>
      <text x="844" y="294" fill="#98989D">URP 머티리얼 _ReceiveShadows 끔</text>

      <rect x="828" y="328" width="328" height="72" rx="6" fill="#3A1C1C"/>
      <rect x="828" y="328" width="4" height="72" fill="#FF453A"/>
      <text x="844" y="354" fill="#FF453A" font-weight="600">기본 폰트에 한글 글자 없음</text>
      <text x="844" y="378" fill="#98989D">UI 글자를 영어로 표시</text>

      <rect x="828" y="412" width="328" height="72" rx="6" fill="#3A1C1C"/>
      <rect x="828" y="412" width="4" height="72" fill="#FF453A"/>
      <text x="844" y="438" fill="#FF453A" font-weight="600">비스듬한 면이 계단처럼 거칠어짐</text>
      <text x="844" y="462" fill="#98989D">평평한 면 + 둥근 모서리 + 곧은 벽</text>

      <rect x="828" y="496" width="328" height="72" rx="6" fill="#3A1C1C"/>
      <rect x="828" y="496" width="4" height="72" fill="#FF453A"/>
      <text x="844" y="522" fill="#FF453A" font-weight="600">명령줄 실행이라 직접 조작 불가</text>
      <text x="844" y="546" fill="#98989D">자동 테스트 41개 + 사용자 직접 플레이</text>
    </g>
  </g>
</svg>
